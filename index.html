<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vilaow CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE   calm, exact work tool for phone reps; nothing decorative between them and the next call
IDEA    a switchboard ledger: destinations down the side, one line per professional, a call card that slides in
PICTURE the list itself, with status pills and follow-up times as the visual rhythm
COLOUR  Vilaow navy sidebar, aegean for actions, one gold accent for "next call"; status hues kept soft
TYPE    Manrope throughout; 13 / 14 / 16 / 22px
LAYOUT  sidebar | list | docked call card on wide screens; stacked cards and full-screen card on phones
*/
:root{
  --navy:#0d2236;--navy2:#15314c;--navy3:#1d3e5e;
  --aegean:#1f6f8b;--aegean-d:#175a71;--aegean-l:#e4f1f5;
  --gold:#c9a24b;--gold-d:#a9862f;--gold-l:#f8f1de;
  --bg:#f3f5f7;--surface:#fff;--ink:#132130;--ink2:#2c3c4c;--muted:#5f6f80;--faint:#8a97a5;
  --line:#e2e7ec;--line2:#eef1f4;--danger:#b42318;--danger-l:#fdecea;--ok:#137a3a;
  --r:10px;--sh:0 1px 2px rgba(13,34,54,.06),0 6px 24px rgba(13,34,54,.08);
  --side:268px;--drawer:min(620px,100vw);
  color-scheme:light;
}
*{box-sizing:border-box;min-width:0}
html,body,#root{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--aegean)}
[hidden]{display:none!important}
.ltr{direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- buttons & inputs ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:#c9d2db;background:#f8fafb}
.btn.pri{background:var(--aegean);border-color:var(--aegean);color:#fff}
.btn.pri:hover{background:var(--aegean-d)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1405}
.btn.gold:hover{background:var(--gold-d);border-color:var(--gold-d)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line2)}
.btn.danger{color:var(--danger);border-color:#f1c4bf}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.icon{width:38px;padding:0}
.btn:disabled{opacity:.5;cursor:default}
.inp{width:100%;min-height:40px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:15px;transition:border-color .12s,box-shadow .12s}
.inp:hover{border-color:#cbd4dd}
.inp:focus{outline:0;border-color:var(--aegean);box-shadow:0 0 0 3px rgba(31,111,139,.14)}
.inp.bad{border-color:var(--danger);box-shadow:0 0 0 3px rgba(180,35,24,.1)}
textarea.inp{resize:vertical;min-height:86px;line-height:1.55}
select.inp{padding-inline-end:28px}
label.lab{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 5px}
.field{margin-bottom:14px}
.err{color:var(--danger);font-size:13px;min-height:20px;margin-top:6px}

/* ---------- auth screens ---------- */
.auth{height:100%;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 55%,#22506f 100%);overflow:auto}
.auth-card{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:32px 28px 26px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.auth-card h1{font-size:22px;line-height:1.2;margin:14px 0 4px}
.auth-card p{margin:0 0 22px;color:var(--muted)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--navy);display:grid;place-items:center}
.brand .mark svg{width:20px;height:20px}
.brand small{font-weight:600;color:var(--gold);font-size:12px;letter-spacing:.02em}
.auth .btn.pri{width:100%;min-height:44px;font-size:15px}
.boot{height:100%;display:grid;place-items:center;color:var(--muted)}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--aegean);animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- app shell ---------- */
.app{height:100%;display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:56px minmax(0,1fr)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--navy);color:#fff;border-bottom:1px solid #0a1a2a}
.top .brand{color:#fff;min-width:calc(var(--side) - 32px)}
.top .brand .mark{background:var(--navy3)}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;height:38px;border-radius:9px;border:1px solid var(--navy3);background:var(--navy2);color:#fff;padding-block:0;padding-inline:38px 34px;font-size:14px}
.search input::placeholder{color:#93a7bb}
.search input:focus{outline:0;border-color:var(--gold);background:#1a3955}
.search .svg{position:absolute;inset-inline-start:11px;top:10px;color:#93a7bb}
.search kbd{position:absolute;inset-inline-end:9px;top:9px;font:600 11px/18px Manrope,sans-serif;padding:0 6px;border-radius:5px;background:var(--navy3);color:#b9c8d6}
.top-sp{flex:1}
.today{display:flex;align-items:baseline;gap:6px;font-size:13px;color:#b9c8d6;white-space:nowrap}
.today b{font-size:18px;color:#fff;font-weight:800}
.online{display:flex;align-items:center}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none;border:2px solid var(--navy);text-transform:uppercase}
.online .av{margin-inline-start:-7px}
.online .av:first-child{margin-inline-start:0}
.me-btn{display:flex;align-items:center;gap:8px;background:transparent;border:0;color:#fff;padding:4px 6px;border-radius:8px}
.me-btn:hover{background:var(--navy2)}
.me-btn .who{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;font-size:13px}
.me-btn .who small{color:#93a7bb;font-size:11.5px}
.menu{position:absolute;top:52px;inset-inline-end:12px;z-index:40;background:#fff;color:var(--ink);border-radius:10px;box-shadow:var(--sh);border:1px solid var(--line);min-width:200px;padding:6px}
.menu button{display:flex;width:100%;align-items:center;gap:9px;border:0;background:transparent;padding:9px 10px;border-radius:7px;text-align:start}
.menu button:hover{background:var(--line2)}
.hamb{display:none;color:#fff}
.conn{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:60;background:#7a2e0e;color:#fff;font-size:13px;padding:6px 14px;border-radius:20px;box-shadow:var(--sh)}

/* ---------- sidebar ---------- */
.side{background:#fff;border-inline-end:1px solid var(--line);overflow-y:auto;padding:14px 10px 30px}
.side h4{font-size:12px;color:var(--faint);font-weight:700;margin:18px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:8px;text-align:start;color:var(--ink2);font-weight:600}
.nav:hover{background:var(--line2)}
.nav.on{background:var(--aegean-l);color:var(--aegean-d)}
.nav .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .cnt{font-size:12.5px;color:var(--faint);font-weight:600;font-variant-numeric:tabular-nums}
.nav.on .cnt{color:var(--aegean)}
.badge{min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:var(--danger);color:#fff;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center}
.badge.soft{background:var(--gold-l);color:#7a5d17}
.dest{display:block;width:100%;border:0;background:transparent;padding:8px 10px 9px;border-radius:8px;text-align:start}
.dest:hover{background:var(--line2)}
.dest.on{background:var(--aegean-l)}
.dest .row1{display:flex;justify-content:space-between;gap:8px;font-weight:600;color:var(--ink2)}
.dest.on .row1{color:var(--aegean-d)}
.dest .row1 span:last-child{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.prog{height:4px;border-radius:3px;background:var(--line2);margin-top:6px;overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.prog .h{background:#9fc3d0}.prog .j{background:var(--ok)}
.side-foot{margin:18px 10px 0;font-size:12px;color:var(--faint);line-height:1.5}

/* ---------- main list ---------- */
.main{overflow-y:auto;padding:18px 22px 40px;transition:padding .18s}
body.dock .main{padding-inline-end:calc(var(--drawer) + 22px)}
.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.head h2{margin:0;font-size:22px;line-height:1.15;letter-spacing:-.01em}
.head .sub{color:var(--muted);font-size:13px;margin-top:3px}
.head .sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip:hover{border-color:#c5cfd8}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .n{font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.chip.on .n{color:#b9c8d6}
.chip .dot{width:8px;height:8px;border-radius:50%}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 12px}
.toolbar .inp{min-height:34px;font-size:13px;padding:5px 9px;width:auto}
.tgl{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}
.tgl input{width:16px;height:16px;accent-color:var(--aegean)}
.bulk{position:sticky;top:-18px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--navy);color:#fff;padding:8px 12px;border-radius:10px;margin-bottom:10px;box-shadow:var(--sh)}
.bulk .inp{min-height:32px;font-size:13px;width:auto;padding:4px 8px}

.tbl{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tr{display:grid;grid-template-columns:var(--cols);align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line2);cursor:pointer;position:relative}
.tbl{--cols:minmax(0,2.6fr) 118px 150px 92px 120px minmax(0,1.15fr) 104px}
.tbl.sel{--cols:22px minmax(0,2.6fr) 118px 150px 92px 120px minmax(0,1.15fr) 104px}
.tr:first-child{border-top:0}
.tr:hover{background:#f8fafc}
.tr.open{background:var(--aegean-l);box-shadow:inset 3px 0 0 var(--aegean)}
.tr.th{cursor:default;background:#f8fafb;font-size:12px;font-weight:700;color:var(--faint);padding-block:8px}
.tr.th:hover{background:#f8fafb}
.nm{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--ink)}
.nm bdi,.addr bdi{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.addr{display:flex;gap:4px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.addr span{flex:none}
.flags{display:inline-flex;gap:4px;flex:none}
.flag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--gold-l);color:#7a5d17;white-space:nowrap}
.flag.dup{background:#eef0ff;color:#3f3fa8}
.sec{font-size:13px;color:var(--ink2)}
.ph{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--ink);text-decoration:none;white-space:nowrap}
a.ph:hover{color:var(--aegean);text-decoration:underline}
.rate{font-size:13px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.rate .star{color:var(--gold)}
.rate .rv{color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.s-new{background:#eef2f6;color:#4c5d6f}
.s-no_answer{background:#fdf2df;color:#9a4a07}
.s-callback{background:#e5effb;color:#1b579b}
.s-interested{background:#ddf3ef;color:#0d6a62}
.s-joined{background:#dff3e5;color:#137a3a}
.s-not_interested{background:#fbe7ea;color:#a3123a}
.s-not_relevant{background:#e8ebee;color:#55616d}
.due{font-size:12.5px;line-height:1.35}
.due b{display:block;font-weight:700;color:var(--ink2);white-space:nowrap}
.due span{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due.late b{color:var(--danger)}
.due.tday b{color:#9a4a07}
.rep{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.rep .av{width:24px;height:24px;font-size:10.5px;border:0}
.watch{position:absolute;inset-inline-start:4px;top:50%;transform:translateY(-50%);width:6px;height:28px;border-radius:3px}
.rowact{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);display:none;gap:6px}
.tr:hover .rowact{display:flex}
.rowact .btn{background:#fff;box-shadow:var(--sh)}
.more{display:flex;justify-content:center;padding:14px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-size:16px;color:var(--ink2);margin-bottom:4px}
.cb{width:17px;height:17px;accent-color:var(--aegean);cursor:pointer}

/* ---------- drawer (call card) ---------- */
.drawer{position:fixed;top:56px;bottom:0;inset-inline-end:0;width:var(--drawer);background:#fff;border-inline-start:1px solid var(--line);box-shadow:-12px 0 40px rgba(13,34,54,.10);z-index:30;display:flex;flex-direction:column;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}.spin{animation-duration:2s}}
.dh{padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.dh-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.dh-top .sp{flex:1}
.saved{font-size:12.5px;font-weight:600;color:var(--faint);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.saved.ok{color:var(--ok)}.saved.err{color:var(--danger)}.saved.busy{color:var(--aegean)}
.dname{font-size:20px;font-weight:800;line-height:1.25;letter-spacing:-.01em;border:1px solid transparent;border-radius:7px;padding:2px 6px;margin:0 -6px;width:calc(100% + 12px);background:transparent}
.dname:hover{border-color:var(--line)}
.dname:focus{outline:0;border-color:var(--aegean);background:#fff}
.dmeta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;color:var(--muted);font-size:13px;margin-top:4px}
.dmeta select{border:1px solid transparent;background:transparent;font-weight:600;color:var(--ink2);border-radius:6px;padding:2px 4px}
.dmeta select:hover{border-color:var(--line)}
.warn{margin-top:10px;display:flex;gap:8px;align-items:center;font-size:13px;background:var(--gold-l);color:#6b5014;border-radius:8px;padding:7px 10px}
.warn.blue{background:#e8eefc;color:#2a3f8f}
.db{flex:1;overflow-y:auto;padding:14px 18px 40px}
.sect{margin-bottom:18px}
.sect>h5{font-size:12px;font-weight:700;color:var(--faint);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sect>h5 .sp{flex:1}
.callrow{display:flex;gap:8px;align-items:stretch}
.callrow .inp{font-size:19px;font-weight:700;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.callrow .btn{min-height:46px}
.btn.call{background:var(--ok);border-color:var(--ok);color:#fff;font-size:15px;padding:0 18px}
.btn.call:hover{background:#0f6630}
.btn.wa{color:#128c4a}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.grid2 .inp{font-size:14px}
.kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.kv b{color:var(--ink2);font-weight:600}
.status-now{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.status-now .pill{height:28px;font-size:13.5px;padding:0 12px}
.outs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.out{display:flex;align-items:center;gap:8px;min-height:46px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13.5px;text-align:start;transition:border-color .12s,background .12s}
.out:hover{border-color:#bfcad4;background:#fafbfc}
.out .k{margin-inline-start:auto;font:700 11px/18px Manrope,sans-serif;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.out i{width:10px;height:10px;border-radius:50%;flex:none}
.out.on{border-color:var(--aegean);box-shadow:0 0 0 3px rgba(31,111,139,.14);background:var(--aegean-l)}
.oform{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fbfcfd}
.qp{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.qp .chip{height:30px;font-size:12.5px}
.oform .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.oform .row .sp{flex:1}
.fu{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:8px;align-items:center}
.fu.late .inp:first-child{border-color:#f0b4ad;color:var(--danger);font-weight:700}
.hist{position:relative;margin:0;padding:0;list-style:none}
.hist li{position:relative;padding:0 0 14px;padding-inline-start:26px}
.hist li::before{content:"";position:absolute;inset-inline-start:7px;top:6px;bottom:-6px;width:2px;background:var(--line2)}
.hist li:last-child::before{display:none}
.hist li>i{position:absolute;inset-inline-start:2px;top:4px;width:12px;height:12px;border-radius:50%;background:#cfd8e0;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.hist .h1{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px}
.hist .h1 b{font-weight:700}
.hist .h1 time{color:var(--faint);font-size:12px;margin-inline-start:auto}
.hist .note{white-space:pre-wrap;font-size:13.5px;color:var(--ink2);margin-top:3px;overflow-wrap:anywhere}
.hist .meta2{font-size:12.5px;color:var(--muted);margin-top:2px}
.dfoot{border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:8px;align-items:center;background:#fbfcfd}
.dfoot .sp{flex:1}

/* ---------- admin ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--aegean-d);border-bottom-color:var(--aegean)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:16px}
.card .hint{color:var(--muted);font-size:13px;margin:-6px 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi>span{font-size:12.5px;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-size:12px;color:var(--faint);font-weight:700;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t td.n,table.t th.n{text-align:end;font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.formrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:10px;align-items:end}
.bar{height:8px;border-radius:4px;background:var(--line2);display:flex;overflow:hidden;min-width:120px}
.bar i{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px}
.feed li{padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px;list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.feed{margin:0;padding:0}
.feed time{color:var(--faint);font-size:12px;margin-inline-start:auto}
.feed a{cursor:pointer;font-weight:700;color:var(--ink);text-decoration:none}
.feed a:hover{color:var(--aegean)}
.drop{border:2px dashed #c9d3dc;border-radius:12px;padding:22px;text-align:center;color:var(--muted);background:#fafbfc}
.drop.over{border-color:var(--aegean);background:var(--aegean-l)}

/* ---------- toasts & modal ---------- */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;background:var(--navy);color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;max-width:92vw}
.toast.bad{background:#7a1c12}
.toast button{background:transparent;border:0;color:var(--gold);font-weight:700}
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,24,38,.45);display:grid;place-items:center;padding:16px}
.mbox{background:#fff;border-radius:14px;width:100%;max-width:440px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.mbox h3{margin:0 0 6px;font-size:17px}
.mbox p{margin:0 0 14px;color:var(--muted)}
.mbox .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.keys kbd{font:700 12px/22px Manrope,sans-serif;padding:0 7px;border-radius:5px;border:1px solid var(--line);background:#f6f8fa;text-align:center;min-width:28px}
.progress{height:10px;border-radius:5px;background:var(--line2);overflow:hidden;margin:12px 0 6px}
.progress i{display:block;height:100%;background:var(--aegean);transition:width .2s}

/* ---------- responsive ---------- */
@media (max-width:1279px){body.dock .main{padding-inline-end:22px}}
#lbody{container:lst/inline-size}
@container lst (max-width:1000px){
  .tbl{--cols:minmax(0,2.4fr) 140px 108px minmax(0,1.1fr) 100px}
  .tbl.sel{--cols:22px minmax(0,2.4fr) 140px 108px minmax(0,1.1fr) 100px}
  .c-sec,.c-rate{display:none}
}
@container lst (max-width:700px){
  .tr.th{display:none}
  .tbl .tr{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n s" "p d" "r d";gap:4px 10px;padding:12px}
  .tbl.sel .tr{grid-template-columns:22px minmax(0,1fr) auto;grid-template-areas:"c n s" "c p d" "c r d"}
  .c-cb{grid-area:c;align-self:start;padding-top:2px}
  .c-name{grid-area:n}.c-st{grid-area:s;justify-self:end}.c-ph{grid-area:p}.c-due{grid-area:d;justify-self:end;text-align:end}.c-rep{grid-area:r}
  .rowact{display:none!important}
  .c-rep .muted,.c-due:empty{display:none}
}
@media (max-width:1100px){.today{display:none}}
@media (max-width:860px){
  :root{--side:280px}
  body{overflow:auto}
  #root{height:auto;min-height:100%}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:56px auto;height:auto;min-height:100%}
  .top{position:sticky;top:0;z-index:35;gap:8px;padding:0 10px}
  .top .brand{min-width:0}.top .brand>span:not(.mark){display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin-inline:-12px;padding-inline:12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .saved{font-size:11.5px}
  .saved:not(.ok):not(.busy):not(.err){display:none}
  .hamb{display:inline-flex}
  .online,.me-btn .who,.search kbd{display:none}
  .side{position:fixed;top:56px;bottom:0;inset-inline-start:0;width:var(--side);z-index:34;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--sh)}
  body.side-open .side{transform:none}
  .main{overflow:visible;padding:14px 12px 40px}
  .drawer{top:0;z-index:50;width:100vw}
  .outs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .out .k{display:none}
  .fu{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .formrow{grid-template-columns:1fr 1fr}
  .callrow{flex-wrap:wrap}
  .callrow .inp{flex:1 1 100%}
  .callrow .btn{flex:1}
}

        let m = error.message;
        try { const j = await error.context.json(); m = j.error || m; } catch { }

    async signIn(u, p) { return ok(await sb.auth.signInWithPassword({ email: email(u), password: p })); },

        const rows = ok(await sb.from('professionals').select('*').order('id').range(from, from + step - 1));

        p_id: p.id, p_status: p.status, p_note: p.note || null, p_next_at: p.next_at || null,

        .on('postgres_changes', { event: '*', schema: 'public', table: 'professionals' }, p => h.pro(p.eventType, p.new, p.old))

function toast(msg, bad = false, ms = 2600) {

function modal(html, mount) {
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML = `<div class="mbox" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(wrap);
  const close = () => { wrap.remove(); document.removeEventListener('keydown', onKey, true); };
  const onKey = e => { if (e.key === 'Escape' && !wrap.dataset.lock) { e.stopPropagation(); close(); } };
  document.addEventListener('keydown', onKey, true);
  wrap.addEventListener('mousedown', e => { if (e.target === wrap && !wrap.dataset.lock) close(); });
  mount?.(wrap.firstElementChild, close, wrap);
  setTimeout(() => wrap.querySelector('input,textarea,select,button.pri')?.focus(), 30);
  return close;
}

function renderSetup() {
  document.body.className = '';

async function showAuth(msg) {

/* ================= start ================= */
let started = false;
async function start() {
  renderBoot('Loading professionals…');
  const sess = await API.session();
  if (!sess) return showAuth();
  let profiles;
  try { profiles = await API.profiles(); } catch (e) { return renderLogin(errText(e)); }
  const me = profiles.find(x => x.id === sess.user.id);
  if (!me || !me.active) { await API.signOut(); return renderLogin('This user is not active. Please contact your admin.'); }
  S.me = me; setProfiles(profiles);
  try { setPros(await API.pros()); } catch (e) { return renderLogin(errText(e)); }
  renderShell();
  applyHash();
  if (!started) {
    started = true;
    API.realtime({ pro: onProEvent, act: onActEvent, profile: onProfileEvent, status: onRtStatus });
    S.pres = API.presence(S.me.id, presenceState, onPresence);
    setInterval(refreshToday, 5 * 60e3);
    setInterval(() => scheduleRender(), 60e3);
  }
  refreshToday();
  if (isAdmin() && S.pros.length === 0 && seedRows().length) runImport(seedRows(), { title: 'Loading the professionals list', auto: true });
}
async function refreshToday() {
  if (!S.me) return;
  try { S.today = await API.myCallsSince(S.me.id, startOfDay().toISOString()); const el = $('#today b'); if (el) el.textContent = nf(S.today); } catch { }
}
async function reloadData() {
  try { setPros(await API.pros()); setProfiles(await API.profiles()); scheduleRender(); if (S.openId) { patchDrawer(); loadActs(S.openId); } } catch { }
}

/* ================= realtime handlers ================= */
function onProEvent(type, row, old) { if (type === 'DELETE') removePro(old?.id); else upsertPro(row); }
function onActEvent(a) {
  if (S.openId && a.professional_id === S.openId && S.actsFor === S.openId && !S.acts.some(x => x.id === a.id)) { S.acts.unshift(a); renderHist(); }
  if (S.page === 'admin') { S.feed.unshift(a); S.feed = S.feed.slice(0, 200); if (S.adminTab === 'feed') renderAdmin(); }
}
function onProfileEvent(type, row) {
  if (type === 'DELETE' || !row) return;
  S.profiles.set(row.id, row);
  if (row.id === S.me.id) {
    S.me = row;
    if (!row.active) { API.signOut().then(() => renderLogin('This user has been deactivated. Please contact your admin.')); return; }
  }
  scheduleRender();
  if (S.page === 'admin') renderAdmin();
}
let rtWasDown = false;
function onRtStatus(st) {
  const bar = $('#conn'); if (!bar) return;
  if (st === 'SUBSCRIBED') { bar.hidden = true; if (rtWasDown) { rtWasDown = false; reloadData(); } }
  else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') { rtWasDown = true; bar.hidden = false; }
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

  const f = S.f, onList = S.page === 'list' && !f.q;

  const destStats = new Map();

    let d = destStats.get(p.destination); if (!d) destStats.set(p.destination, d = { t: 0, h: 0, j: 0 });

    S.limit = 250; renderList(); return;
  }
  const ctl = t.closest('[data-ctl]')?.dataset.ctl;
  if (ctl === 'next') return goNext();
  if (ctl === 'more') { S.limit += 250; return renderList(); }

  if (ctl === 'bclr') { S.sel.clear(); return renderList(); }
  if (ctl === 'bexp') return exportRows(S.pros.filter(p => S.sel.has(p.id)), 'vilaow-selected');
  if (ctl === 'bdel') {

    if (!await confirmBox('Delete professionals', `Permanently delete ${nf(ids.length)} professionals and all their history? This cannot be undone.`, 'Delete permanently', true)) return;
    try { const n = await API.bulk(ids, 'delete'); ids.forEach(removePro); S.sel.clear(); toast(`Deleted ${nf(n)}`); renderList(); } catch (x) { toast(errText(x), true); }
    return;
  }
  const nr = t.closest('[data-nr]');
  if (nr) { e.stopPropagation(); return quickNotRelevant(+nr.dataset.nr); }
  const sel = t.closest('[data-sel]');
  if (sel) { const id = +sel.dataset.sel; sel.checked ? S.sel.add(id) : S.sel.delete(id); renderBulk(); return; }
  if (t.closest('.c-cb') || t.closest('[data-ctl]') || t.closest('select,label')) return;

/* ================= queue ================= */
function queue() {
  const now = Date.now(), me = S.me.id;
  const vis = visible();
  const free = p => !p.assigned_to || p.assigned_to === me;
  const busy = p => watchersOf(p.id).length > 0;
  const due = vis.filter(p => p.next_call_at && Date.parse(p.next_call_at) <= now && !FINAL.has(p.status) && free(p))
    .sort((a, b) => Date.parse(a.next_call_at) - Date.parse(b.next_call_at));
  const fresh = vis.filter(p => p.status === 'new' && !p.next_call_at && free(p) && p.phone);
  const retry = vis.filter(p => p.status === 'no_answer' && !p.next_call_at && free(p) && (!p.last_call_at || now - Date.parse(p.last_call_at) > 3 * 36e5))
    .sort((a, b) => a.attempts - b.attempts || Date.parse(a.last_call_at || 0) - Date.parse(b.last_call_at || 0));
  return [...due, ...fresh, ...retry].filter(p => p.id !== S.openId && !busy(p));
}
function goNext() {
  const q = queue();
  if (!q.length) { toast('No calls waiting in this list right now'); if (S.openId) closeDrawer(); return; }
  openPro(q[0].id);
}
function step(dir) {
  const rows = visible(); if (!rows.length) return;
  const i = rows.findIndex(p => p.id === S.openId);
  const n = rows[Math.max(0, Math.min(rows.length - 1, i + dir))];
  if (n && n.id !== S.openId) openPro(n.id);
}

/* ================= saver (autosave) ================= */
const Saver = {
  t: {}, dirty: {}, busy: 0, ever: false,
  queue(id, f, v, ms) {
    const k = id + ':' + f; this.dirty[k] = v; clearTimeout(this.t[k]);
    this.t[k] = setTimeout(() => this.flushKey(id, f), ms); this.state();
  },
  async flushKey(id, f) {
    const k = id + ':' + f;
    if (!(k in this.dirty)) return;
    clearTimeout(this.t[k]);
    const v = this.dirty[k]; delete this.dirty[k];
    const p = S.byId.get(id);
    if (!p || (p[f] ?? null) === (v ?? null)) { this.state(); return; }
    this.busy++; this.state();
    try { const row = await API.update(id, { [f]: v }); this.busy--; this.ever = true; upsertPro(row); }
    catch (e) { this.busy--; if (!(k in this.dirty)) this.dirty[k] = v; this.err = errText(e); this.t[k] = setTimeout(() => this.flushKey(id, f), 4000); }
    this.state();
  },
  flushAll() { for (const k of Object.keys(this.dirty)) { const [id, f] = k.split(':'); this.flushKey(+id, f); } },
  isDirty(id, f) { return (id + ':' + f) in this.dirty; },
  pending() { return this.busy > 0 || Object.keys(this.dirty).length > 0; },
  state() {
    const el = $('#saved'); if (!el) return;
    if (this.err && Object.keys(this.dirty).length) { el.className = 'saved err'; el.textContent = 'Not saved – retrying'; el.title = this.err; return; }
    this.err = null;
    if (this.busy) { el.className = 'saved busy'; el.innerHTML = '<span class="spin" style="width:12px;height:12px;border-width:2px"></span>Saving…'; }
    else if (Object.keys(this.dirty).length) { el.className = 'saved busy'; el.textContent = 'Waiting to save…'; }
    else if (this.ever) { el.className = 'saved ok'; el.innerHTML = ico('check', 'svg') + 'Saved'; }
    else { el.className = 'saved'; el.textContent = 'Changes save automatically'; }
  }
};
window.addEventListener('beforeunload', e => { if (Saver.pending()) { Saver.flushAll(); e.preventDefault(); e.returnValue = ''; } });

function chooseOutcome(k) {

let submitting = false;
async function submitOutcome(forced) {
  const p = cur(); const k = forced || S.outcome; if (!p || !k || submitting) return;
  const err = m => { const el = $('#o-err'); if (el) el.textContent = m; else toast(m, true); };
  const form = forced ? null : $('#d-oform');
  const when = form?.querySelector('#o-when')?.value, why = form?.querySelector('#o-why')?.value?.trim() || null;
  const note = form?.querySelector('#o-note')?.value?.trim() || null;
  const reason = form?.querySelector('#o-reason')?.value?.trim() || null;
  const next_at = when ? fromLocalInput(when) : null;
  if (k === 'callback' && !next_at) return err('Choose when to call back');
  if (k === 'not_relevant' && !reason) return err('Choose a reason');
  if (next_at && Date.parse(next_at) < Date.now() - 6e4) return err('That time has already passed');
  submitting = true;
  const btn = $('[data-d="osave"]'); if (btn) btn.disabled = true;
  Saver.flushAll();
  try {
    const row = await API.log({ id: p.id, status: k, note, next_at: (k === 'callback' || k === 'interested') ? next_at : null, next_reason: why, reason, kind: 'call' });
    upsertPro(row);
    S.outcome = null;
    toast(`Saved · ${ST[k].label}${k === 'no_answer' ? ` (attempt ${row.attempts})` : ''}${row.next_call_at ? ' · ' + fmtWhen(row.next_call_at) : ''}`);
    refreshToday();
    if (S.autoNext) { const q = queue(); if (q.length) openPro(q[0].id); else { renderOform(); toast('You have finished all calls in this list'); } }
    else renderOform();
  } catch (x) { err('Save failed: ' + errText(x)); if (btn) btn.disabled = false; }
  finally { submitting = false; }
}

function genPassword() {

let xlsxP = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (xlsxP) return xlsxP;
  xlsxP = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = CFG.xlsx;
    s.onload = () => window.XLSX ? res(window.XLSX) : rej(new Error('xlsx'));
    s.onerror = () => { xlsxP = null; rej(new Error('Could not load the Excel component')); };
    document.head.appendChild(s);
  });
  return xlsxP;
}
async function exportRows(rows, name) {
  if (!rows.length) return toast('Nothing to export');
  const data = rows.map(p => ({
    'Destination': p.destination, 'Area': p.area || '', 'Sector': p.sector, 'Name': p.name,
    'Phone': p.phone || '', 'Second phone': p.phone2 || '', 'Email': p.email || '', 'Address': p.address || '',
    'Rating': p.rating ?? '', 'Reviews': p.reviews ?? '', 'Status': ST[p.status]?.label || p.status, 'Reason': p.status_reason || '',
    'Follow-up': fmtFull(p.next_call_at), 'Follow-up reason': p.next_call_reason || '', 'Attempts': p.attempts,
    'Last call': fmtFull(p.last_call_at), 'Assigned to': repName(p.assigned_to), 'Notes': p.notes || '',
    'Source note': p.source_note || '', 'Google Maps': p.maps_url || ''
  }));
  const stamp = new Date().toISOString().slice(0, 10);
  try {
    const X = await loadXLSX();
    const ws = X.utils.json_to_sheet(data);
    ws['!cols'] = Object.keys(data[0]).map(k => ({ wch: ['Name', 'Address', 'Notes'].includes(k) ? 38 : k === 'Google Maps' ? 30 : 14 }));
    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, 'Professionals');
    X.writeFile(wb, `${name}-${stamp}.xlsx`);
  } catch {
    const keys = Object.keys(data[0]);
    const csv = '﻿' + [keys.join(','), ...data.map(r => keys.map(k => `"${String(r[k] ?? '').replace(/"/g, '""')}"`).join(','))].join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = `${name}-${stamp}.csv`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  toast(`Exported ${nf(rows.length)} rows`);
}
const normName = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
const rowKey = r => r.maps_url ? 'u:' + r.maps_url : 'n:' + normName(r.name) + '|' + digits(r.phone).slice(-10);
function existingKeys() { const s = new Set(); for (const p of S.pros) { s.add(rowKey(p)); s.add('n:' + normName(p.name) + '|' + digits(p.phone).slice(-10)); } return s; }
function wireDrop() {
  const d = $('#drop'), f = $('#file'); if (!d) return;
  f.onchange = () => f.files[0] && importFile(f.files[0]);
  d.ondragover = e => { e.preventDefault(); d.classList.add('over'); };
  d.ondragleave = () => d.classList.remove('over');
  d.ondrop = e => { e.preventDefault(); d.classList.remove('over'); const file = e.dataTransfer.files[0]; if (file) importFile(file); };
}
async function importFile(file) {
  let X; try { X = await loadXLSX(); } catch (e) { return toast(errText(e), true); }
  try {
    const wb = X.read(await file.arrayBuffer(), { type: 'array' });
    const names = wb.SheetNames.includes('All Professionals') ? ['All Professionals'] : wb.SheetNames;
    const HMAP = { destination: 'destination', area: 'area', sector: 'sector', name: 'name', phone: 'phone', address: 'address', rating: 'rating', reviews: 'reviews', 'google maps': 'maps', note: 'note', 'source note': 'note' };
    let out = [];
    for (const sn of names) {
      const ws = wb.Sheets[sn]; if (!ws['!ref']) continue;
      const rows = X.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
      const hi = rows.findIndex(r => r && r.some(c => HMAP[String(c || '').trim().toLowerCase()] === 'name'));
      if (hi < 0) continue;
      const idx = {}; rows[hi].forEach((c, i) => { const k = HMAP[String(c || '').trim().toLowerCase()]; if (k && idx[k] == null) idx[k] = i; });
      if (idx.name == null || idx.destination == null || idx.sector == null) continue;
      const rev = Object.fromEntries(Object.entries(SECTOR_HE).map(([k, v]) => [v, k]));
      const revP = Object.fromEntries(Object.entries(PLACE_HE).map(([k, v]) => [v, k]));
      for (let r = hi + 1; r < rows.length; r++) {
        const row = rows[r]; if (!row) continue;
        const g = k => idx[k] == null ? null : (row[idx[k]] == null ? null : String(row[idx[k]]).trim() || null);
        const name = g('name'); if (!name) continue;
        let maps = null;
        if (idx.maps != null) { const cell = ws[X.utils.encode_cell({ r, c: idx.maps })]; maps = cell?.l?.Target || (/^https?:/.test(g('maps') || '') ? g('maps') : null); }
        const dest = g('destination'), sec = g('sector'), area = g('area');
        out.push({ destination: revP[dest] || dest || 'No destination', area: revP[area] || area, sector: rev[sec] || sec || 'Other', name, phone: g('phone'), address: g('address'),
          rating: g('rating') != null && !isNaN(+g('rating')) ? +g('rating') : null, reviews: g('reviews') != null && !isNaN(parseInt(g('reviews'))) ? parseInt(g('reviews')) : null, maps_url: maps, source_note: g('note') });
      }
      if (out.length) break;
    }
    if (!out.length) return toast('No matching rows found. The file needs Destination, Sector and Name columns.', true);
    runImport(out, { title: 'Import from ' + file.name });
  } catch (e) { toast('Could not read the file: ' + errText(e), true); }
}
function runImport(rows, { title, auto } = {}) {
  const keys = existingKeys(), seen = new Set();
  const fresh = rows.filter(r => { const k = rowKey(r); if (keys.has(k) || seen.has(k)) return false; seen.add(k); return true; });
  const skipped = rows.length - fresh.length;
  modal(`<h3>${esc(title)}</h3><p id="im-t">${auto ? 'First sign-in – loading all professionals into the system.' : ''} ${nf(fresh.length)} new${skipped ? ` · ${nf(skipped)} already exist and will be skipped` : ''}</p>
    <div class="progress"><i id="im-b" style="width:0"></i></div><div class="muted" id="im-s" style="font-size:13px"></div>
    <div class="acts"><button class="btn pri" id="im-go"${fresh.length ? '' : ' disabled'}>${auto ? 'Starting…' : 'Import'}</button></div>`, (box, close, wrap) => {
    const go = async () => {
      const b = box.querySelector('#im-go'); b.disabled = true; wrap.dataset.lock = '1';
      let done = 0;
      for (let i = 0; i < fresh.length; i += 200) {
        const chunk = fresh.slice(i, i + 200);
        let tries = 0;
        for (;;) {
          try { const ins = await API.insert(chunk); addMany(ins); break; }
          catch (x) { if (++tries >= 3) { box.querySelector('#im-s').textContent = 'Import stopped: ' + errText(x) + '. You can run it again – rows already loaded will not be loaded twice.'; delete wrap.dataset.lock; b.textContent = 'Close'; b.disabled = false; b.onclick = close; return; } await new Promise(r => setTimeout(r, 1500)); }
        }
        done += chunk.length;
        box.querySelector('#im-b').style.width = (done / fresh.length * 100) + '%';
        box.querySelector('#im-s').textContent = `Loaded ${nf(done)} of ${nf(fresh.length)}`;
      }
      delete wrap.dataset.lock;
      box.querySelector('#im-s').textContent = `Done: added ${nf(done)} professionals`;
      b.textContent = 'Close'; b.disabled = false; b.onclick = close;
      reindex(); scheduleRender(); if (S.page === 'admin') renderAdmin(true);
    };
    box.querySelector('#im-go').onclick = go;
    if (auto) go();
  });
}

/* ================= keyboard ================= */
function showKeys() {
  modal(`<h3>Keyboard shortcuts</h3><p>They work with any keyboard layout.</p><div class="keys">
    <kbd>N</kbd><span>Open the next call in the queue</span>
    <kbd>1</kbd><span>No answer (saves instantly)</span>
    <kbd>2</kbd><span>Call back – choose time and reason</span>
    <kbd>3</kbd><span>Interested</span><kbd>4</kbd><span>Joined</span><kbd>5</kbd><span>Not interested</span><kbd>6</kbd><span>Not relevant</span>
    <kbd>Ctrl+Enter</kbd><span>Save the call log</span>
    <kbd>C</kbd><span>Call the number</span><kbd>W</kbd><span>WhatsApp</span>
    <kbd>↓ ↑</kbd><span>Next / previous in list</span>
    <kbd>/</kbd><span>Search</span><kbd>Esc</kbd><span>Close the card</span></div>
    <div class="acts"><button class="btn pri" data-x>Got it</button></div>`, (box, close) => { box.querySelector('[data-x]').onclick = close; });
}
document.addEventListener('keydown', e => {
  if (!S.me || !$('#main') || $('.modal')) return;
  const t = e.target, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable;
  if (e.key === 'Escape') {
    if (S.outcome) { S.outcome = null; renderOform(); return; }
    if (typing) { t.blur(); return; }
    if (S.openId) closeDrawer();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && S.outcome) { e.preventDefault(); return submitOutcome(); }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/' || e.code === 'Slash') { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if (e.code === 'KeyN') { e.preventDefault(); return goNext(); }
  if (S.page !== 'list' && !S.openId) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); return S.openId ? step(1) : (visible()[0] && openPro(visible()[0].id)); }
  if (e.key === 'ArrowUp') { e.preventDefault(); return step(-1); }
  if (!S.openId) return;
  const m = /^(?:Digit|Numpad)([1-6])$/.exec(e.code);
  if (m) { e.preventDefault(); return chooseOutcome(OUTS[+m[1] - 1].k); }
  if (e.code === 'KeyC') { const a = $('#d-call'); if (a && !a.hidden) a.click(); }
  if (e.code === 'KeyW') { const a = $('#d-wa'); if (a && !a.hidden) a.click(); }
});

/* ================= hash / visibility ================= */
function setHash() {
  const h = S.openId ? '#p' + S.openId : (S.page === 'admin' ? '#admin' : '');
  if (location.hash !== h) history.replaceState(null, '', h || location.pathname + location.search);
}
function applyHash() {
  const h = location.hash;
  if (h === '#admin' && isAdmin()) { S.page = 'admin'; renderSide(); renderMain(); }
  const m = /^#p(\d+)$/.exec(h); if (m && S.byId.has(+m[1])) openPro(+m[1]);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) S.hiddenAt = Date.now();
  else if (S.me && S.hiddenAt && Date.now() - S.hiddenAt > 120e3) { reloadData(); refreshToday(); }
});

/* ================= init ================= */
API.onAuth((ev) => { if (ev === 'SIGNED_OUT' && S.me) { S.me = null; started && location.reload(); } });
(async () => {
  renderBoot();
  try { const s = await API.session(); if (s) await start(); else await showAuth(); }
  catch (e) { renderLogin(errText(e)); }
})();
window.__CRM__ = { S, API };
})();

</script>
